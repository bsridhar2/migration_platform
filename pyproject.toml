[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[project]
name = "migration-platform"
version = "2.0.0"
description = "AI-powered Java monolith to React + Spring Boot migration platform"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"

dependencies = [
    # ── LangChain 1.x ecosystem ──────────────────────────────────────────
    "langchain>=1.0.0,<2.0.0",
    "langchain-core>=1.0.0,<2.0.0",
    "langchain-anthropic>=0.3.0,<1.0.0",
    "langchain-openai>=0.3.0,<1.0.0",

    # ── LangGraph 1.x ────────────────────────────────────────────────────
    "langgraph>=1.0.0,<2.0.0",

    # ── Underlying LLM SDKs (langchain providers use these internally) ───
    "anthropic>=0.40.0,<1.0.0",
    "openai>=1.55.0,<2.0.0",

    # ── In-Process Data Layer (zero servers) ─────────────────────────────
    "networkx>=3.3,<4.0",
    "python-louvain>=0.16,<0.17",
    "chromadb>=0.5.20,<0.6.0",
    "duckdb>=1.1.0,<2.0.0",
    "diskcache>=5.6.3,<6.0.0",

    # ── Code Parsers ─────────────────────────────────────────────────────
    "javalang>=0.13.0,<0.14.0",
    "beautifulsoup4>=4.12.3,<5.0.0",
    "lxml>=5.3.0,<6.0.0",

    # ── Embeddings / Tokenisation ─────────────────────────────────────────
    "tiktoken>=0.8.0,<1.0.0",
    "numpy>=1.26.0,<2.0.0",

    # ── API Framework ─────────────────────────────────────────────────────
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
    "python-multipart>=0.0.12,<1.0.0",
    "websockets>=13.0,<15.0",

    # ── Git Integration ────────────────────────────────────────────────────
    "gitpython>=3.1.43,<4.0.0",

    # ── Data Models / Validation ──────────────────────────────────────────
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",

    # ── Utilities ─────────────────────────────────────────────────────────
    "python-dotenv>=1.0.1,<2.0.0",
    "aiofiles>=24.1.0,<25.0.0",
    "httpx>=0.28.0,<1.0.0",
    "structlog>=24.4.0,<25.0.0",
    "tenacity>=9.0.0,<10.0.0",
    "rich>=13.9.0,<14.0.0",
    "typer>=0.15.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "httpx>=0.28.0",
]

[project.scripts]
migration-platform = "migration_platform.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/migration_platform"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["migration_platform"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=migration_platform --cov-report=term-missing -v"
